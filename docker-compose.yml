version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eagle-eye-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
      - ./eagle_eye.sqlite3:/app/eagle_eye.sqlite3
    environment:
      - PORT=8000
      - DEMO_MODE=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eagle-eye-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
